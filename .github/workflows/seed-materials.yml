name: Seed Materials (One-Time)

# Manual trigger only — this is a one-time operation to populate the materials catalog.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-seed (overwrites existing static-seed rows)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: seed-materials
  cancel-in-progress: false

env:
  KEY_VAULT: Greenchainz-vault
  AZURE_CLIENT_ID: 8b597068-9347-4e99-8860-8c4e9a9bc112
  AZURE_TENANT_ID: 1d04bf50-8175-40af-a9d5-f8e441460b06
  AZURE_SUBSCRIPTION_ID: f9164e8d-d74d-43ea-98d4-b0466b3ef8b8

jobs:
  seed:
    name: Seed Materials to Production DB
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Pull DATABASE_URL from Key Vault
        id: secrets
        run: |
          DB_URL=$(az keyvault secret show --vault-name "${{ env.KEY_VAULT }}" --name "Database-URL" --query value -o tsv)
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV

      - name: Run materials seed
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          npx tsx scripts/seed-materials-static.ts $ARGS

      - name: Verify materials exist
        run: |
          npx tsx -e "
            import 'dotenv/config';
            import { getDb } from './server/db.js';
            import { materials } from './drizzle/schema.js';
            import { count } from 'drizzle-orm';
            const db = getDb();
            const [{ count: n }] = await db.select({ count: count() }).from(materials);
            console.log('Total materials in database:', n);
            if (n < 10) { console.error('ERROR: Expected at least 10 materials'); process.exit(1); }
            console.log('✅ Materials seed verified');
            process.exit(0);
          "
