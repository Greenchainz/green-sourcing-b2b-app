name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm version is resolved from the "packageManager" field in package.json
      # (single source of truth). Do NOT add a `with: version:` input here — passing
      # a version while packageManager is also set makes pnpm/action-setup fail with
      # "Multiple versions of pnpm specified" (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify
        run: pnpm verify

  migration-drift-check:
    name: Migration Drift Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate drizzle artifacts and fail on drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/greenchainz_ci
        run: |
          pnpm db:generate
          git diff --quiet -- drizzle || (echo "Drizzle artifacts are out of date. Run 'pnpm db:generate' and commit the results."; git --no-pager diff -- drizzle; exit 1)

  container-build-check:
    name: Container Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: greenchainz-backend:pr-check

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: greenchainz-frontend:pr-check
          build-args: |
            VITE_BACKEND_URL=
            VITE_AZURE_MAPS_KEY=

  e2e:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests (Chromium)
        run: pnpm test:e2e:chromium
