name: Trigger auto deployment for greenchainz-frontend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/greenchainz-frontend-AutoDeployTrigger-e801a400-dc1f-4335-aff0-5fc0f7eb13f0.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.GREENCHAINZFRONTEND_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrgreenchainzprod916.azurecr.io
          registryUsername: ${{ secrets.GREENCHAINZFRONTEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GREENCHAINZFRONTEND_REGISTRY_PASSWORD }}
          containerAppName: greenchainz-frontend
          resourceGroup: rg-greenchainz-prod-container
          imageToBuild: acrgreenchainzprod916.azurecr.io/greenchainz-frontend:${{ github.sha }}
          
            

     

