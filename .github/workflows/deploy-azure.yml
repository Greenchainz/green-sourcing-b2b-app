name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ─── GitHub Variables (Settings → Variables → Actions) ──────────────────────────────────
# Non-sensitive identifiers — NOT secrets:
#   AZURE_CLIENT_ID       → 479e2a01-70ab-4df9-baa4-560d317c3423
#   AZURE_TENANT_ID       → ca4f78d4-c753-4893-9cd8-1b309922b4dc
#   AZURE_SUBSCRIPTION_ID → your Azure subscription ID
# ──────────────────────────────────────────────────────────────────────────────

env:
  ACR: acrgreenchainzprod916
  RESOURCE_GROUP: rg-greenchainz-prod-container
  FRONTEND_APP: greenchainz-frontend
  BACKEND_APP: greenchainz-backend
  FRONTEND_IMAGE: greenchainz-frontend
  BACKEND_IMAGE: greenchainz-backend
  KEY_VAULT: Greenchainz-vault
  DB_SERVER_RG: rg-greenchainz
  DB_SERVER_NAME: greenchainz-db-prod

jobs:
  # ── Job 1: Typecheck + unit tests ───────────────────────────────────────────────
  test:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

  # ── Job 2: Build + push both Docker images ──────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC — no stored credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Pull build secrets from Key Vault
        id: kv
        run: |
          get_secret() {
            local name="$1"
            local value
            value=$(az keyvault secret show --vault-name "${{ env.KEY_VAULT }}" --name "$name" --query value -o tsv 2>/dev/null) || value=""
            echo "::add-mask::$value"
            echo "${name}=${value}" >> $GITHUB_OUTPUT
          }
          get_secret azure-maps-key
          get_secret sentry-dsn
          get_secret sentry-auth-token
          get_secret sentry-org
          get_secret sentry-project

      - name: Log in to ACR (token-based — no username/password)
        run: az acr login --name ${{ env.ACR }}

      - name: Set up Docker Buildx (layer caching)
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.ACR }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.ACR }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.ACR }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:cache,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://greenchainz.com
            NEXT_PUBLIC_AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}
            NEXT_PUBLIC_AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}
            # Same-origin auth model: keep backend URL vars empty in production.
            NEXT_PUBLIC_BACKEND_URL=
            VITE_BACKEND_URL=
            VITE_AZURE_MAPS_KEY=${{ steps.kv.outputs.azure-maps-key }}
            VITE_FRONTEND_WEBPUBSUB_ENDPOINT=https://greenchainz.webpubsub.azure.com
            VITE_FRONTEND_WEBPUBSUB_HUB=greenchainzhub

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.ACR }}.azurecr.io/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.ACR }}.azurecr.io/${{ env.BACKEND_IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.ACR }}.azurecr.io/${{ env.BACKEND_IMAGE }}:cache,mode=max

      - name: Azure logout
        run: az logout || true
        if: always()

  # ── Job 3: Migrate + seed ──────────────────────────────────────────────────────────────
  migrate:
    name: Migrate & Seed DB
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Pull DATABASE_URL from Key Vault
        id: kv
        run: |
          DB_URL=$(az keyvault secret show --vault-name "${{ env.KEY_VAULT }}" --name "Database-URL" --query value -o tsv 2>/dev/null) || DB_URL=""
          echo "::add-mask::$DB_URL"
          echo "Database-URL=${DB_URL}" >> $GITHUB_OUTPUT

      - name: Open PostgreSQL firewall for runner
        id: firewall
        run: |
          RUNNER_IP=$(curl -sf https://api.ipify.org)
          if [ -z "$RUNNER_IP" ]; then
            echo "❌ Could not determine runner IP"
            exit 1
          fi
          echo "Runner IP: $RUNNER_IP"
          az postgres flexible-server firewall-rule create \
            --resource-group ${{ env.DB_SERVER_RG }} \
            --name ${{ env.DB_SERVER_NAME }} \
            --rule-name "github-actions-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"
          echo "runner-ip=${RUNNER_IP}" >> $GITHUB_OUTPUT
          # Allow firewall rule to propagate
          sleep 8

      - name: Run Drizzle migrations
        env:
          DATABASE_URL: ${{ steps.kv.outputs.Database-URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Database-URL secret is missing from Key Vault '${{ env.KEY_VAULT }}'"
            exit 1
          fi
          pnpm db:migrate

      - name: Seed manufacturer profiles (skipped if CSV not present)
        env:
          DATABASE_URL: ${{ steps.kv.outputs.Database-URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Database-URL secret is missing from Key Vault '${{ env.KEY_VAULT }}'"
            exit 1
          fi
          if [ ! -f "greenchainz-supplier-targets.csv" ]; then
            echo "⚠️ greenchainz-supplier-targets.csv not found — skipping manufacturer seed."
            echo "ℹ️  To seed: add the CSV to the repo root or run locally with pnpm tsx scripts/seed-manufacturers.ts"
          else
            echo "🌱 Seeding manufacturer profiles..."
            pnpm tsx scripts/seed-manufacturers.ts
          fi

      - name: Seed lead time estimates
        env:
          DATABASE_URL: ${{ steps.kv.outputs.Database-URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Database-URL secret is missing from Key Vault '${{ env.KEY_VAULT }}'"
            exit 1
          fi
          echo "🌱 Seeding lead time estimates..."
          pnpm tsx scripts/seed-lead-times.ts

      - name: Close PostgreSQL firewall for runner
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group ${{ env.DB_SERVER_RG }} \
            --name ${{ env.DB_SERVER_NAME }} \
            --rule-name "github-actions-${{ github.run_id }}" \
            --yes || true

      - name: Azure logout
        run: az logout || true
        if: always()

  # ── Job 4: Deploy both Container Apps ───────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: migrate
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Pull build secrets from Key Vault
        id: kv
        run: |
          get_secret() {
            local name="$1"
            local value
            value=$(az keyvault secret show --vault-name "${{ env.KEY_VAULT }}" --name "$name" --query value -o tsv 2>/dev/null) || value=""
            echo "::add-mask::$value"
            echo "${name}=${value}" >> $GITHUB_OUTPUT
          }
          get_secret sentry-dsn
          get_secret sentry-auth-token
          get_secret sentry-org
          get_secret sentry-project
          # These were added via the Azure portal as KV-reference secrets, but the
          # system identity lacks access. Pull them here and pass as plain env vars.
          get_secret fred-api-key
          get_secret resend-api-key

      - name: Upsert backend runtime secrets in Container App
        # Ensure backend uses Container App-managed secret values (not Key Vault refs),
        # so revision provisioning does not depend on the missing system identity path.
        run: |
          if [ -z "${{ steps.kv.outputs.fred-api-key }}" ] || [ -z "${{ steps.kv.outputs.resend-api-key }}" ]; then
            echo "❌ Required backend secrets (fred-api-key/resend-api-key) are missing from Key Vault '${{ env.KEY_VAULT }}'"
            exit 1
          fi
          az containerapp secret set \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "fred-api-key=${{ steps.kv.outputs.fred-api-key }}" \
              "resend-api-key=${{ steps.kv.outputs.resend-api-key }}"

      - name: Deploy backend
        run: |
          ENV_VARS=(
            "DEPLOY_TIMESTAMP=${{ github.run_id }}"
            "FRONTEND_URL=https://greenchainz.com"
            "FRED_API_KEY=secretref:fred-api-key"
            "RESEND_API_KEY=secretref:resend-api-key"
          )
          if [ -n "${{ steps.kv.outputs.sentry-dsn }}" ]; then
            ENV_VARS+=(
              "SENTRY_DSN=${{ steps.kv.outputs.sentry-dsn }}"
              "SENTRY_RELEASE=${{ github.sha }}"
            )
          fi
          az containerapp update \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --set-env-vars "${ENV_VARS[@]}"

      - name: Deploy frontend
        run: |
          ENV_VARS=("DEPLOY_TIMESTAMP=${{ github.run_id }}")
          if [ -n "${{ steps.kv.outputs.sentry-dsn }}" ]; then
            ENV_VARS+=(
              "SENTRY_DSN=${{ steps.kv.outputs.sentry-dsn }}"
              "SENTRY_RELEASE=${{ github.sha }}"
            )
          fi
          az containerapp update \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            --set-env-vars "${ENV_VARS[@]}"

      - name: Smoke test deployed backend
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          if [ -z "$BACKEND_FQDN" ]; then
            echo "❌ Could not resolve backend ingress FQDN"
            exit 1
          fi

          # Public endpoint should return 200.
          curl -fsS "https://${BACKEND_FQDN}/api/health" > /dev/null
          curl -fsS "https://${BACKEND_FQDN}/health" > /dev/null

          # Protected endpoint should reject unauthenticated requests.
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${BACKEND_FQDN}/api/auth/me")
          if [ "$AUTH_STATUS" != "401" ]; then
            echo "❌ Expected 401 from protected route /api/auth/me, got ${AUTH_STATUS}"
            exit 1
          fi

          # Admin REST routes must reject unauthenticated callers.
          ADMIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://${BACKEND_FQDN}/api/admin/trigger-outreach")
          if [ "$ADMIN_STATUS" != "401" ]; then
            echo "❌ Expected 401 from admin route /api/admin/trigger-outreach, got ${ADMIN_STATUS}"
            exit 1
          fi

          # RFQ PDF routes must reject unauthenticated callers.
          RFQ_PDF_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${BACKEND_FQDN}/api/rfq/1/pdf/summary")
          if [ "$RFQ_PDF_STATUS" != "401" ]; then
            echo "❌ Expected 401 from protected route /api/rfq/:rfqId/pdf/summary, got ${RFQ_PDF_STATUS}"
            exit 1
          fi

      - name: Verify backend runtime frontend origin
        run: |
          FRONTEND_URL_VALUE=$(az containerapp show \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].env[?name=='FRONTEND_URL'].value | [0]" -o tsv)
          if [ "$FRONTEND_URL_VALUE" != "https://greenchainz.com" ]; then
            echo "❌ Expected backend FRONTEND_URL=https://greenchainz.com, got '${FRONTEND_URL_VALUE}'"
            exit 1
          fi

      - name: Smoke test deployed frontend
        run: |
          FRONTEND_FQDN=$(az containerapp show \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          if [ -z "$FRONTEND_FQDN" ]; then
            echo "❌ Could not resolve frontend ingress FQDN"
            exit 1
          fi

          # Frontend root should respond successfully.
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${FRONTEND_FQDN}/")
          if [ "$FRONTEND_STATUS" != "200" ]; then
            echo "❌ Expected 200 from frontend root '/', got ${FRONTEND_STATUS}"
            exit 1
          fi

      - name: Azure logout
        run: az logout || true
        if: always()
