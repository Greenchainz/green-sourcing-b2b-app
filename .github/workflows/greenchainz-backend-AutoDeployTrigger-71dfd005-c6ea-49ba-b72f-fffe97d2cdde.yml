name: Trigger auto deployment for greenchainz-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/greenchainz-backend-AutoDeployTrigger-71dfd005-c6ea-49ba-b72f-fffe97d2cdde.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GREENCHAINZBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GREENCHAINZBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GREENCHAINZBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrgreenchainzprod916.azurecr.io
          registryUsername: ${{ secrets.GREENCHAINZBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GREENCHAINZBACKEND_REGISTRY_PASSWORD }}
          containerAppName: greenchainz-backend
          resourceGroup: rg-greenchainz-prod-container
          imageToBuild: acrgreenchainzprod916.azurecr.io/greenchainz-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


