# FILE: docker-compose.yml
# PURPOSE: Local development environment for the GreenChainz platform.
# The app is a Vite (client) + Express (server) monorepo — single Dockerfile.

services:
  # ---------------------------------
  # SERVICE 1: PostgreSQL Database
  # ---------------------------------
  db:
    image: postgres:15.10
    container_name: greenchainz-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - greenchainz-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-greenchainz_dev}

  # ---------------------------------
  # SERVICE 2: App (Vite + Express monorepo)
  # ---------------------------------
  app:
    container_name: greenchainz-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-greenchainz_dev}

# ---------------------------------
# VOLUMES: Ensures DB data persists
# ---------------------------------
volumes:
  greenchainz-db-data:
    driver: local
